name: Staging deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: randevu-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      STAGING_SUPABASE_PROJECT_REF: smizhsagjpqexveitbqu
      STAGING_SUPABASE_POOLER_HOST: aws-0-eu-central-1.pooler.supabase.com
      SUPABASE_URL: https://smizhsagjpqexveitbqu.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_smh_KUbC7hv3fhTEX21xXQ_zzn6qZnY
      SUPABASE_ADMIN_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
      STAGING_OWNER_A_EMAIL: randevu-staging-owner-a@example.com
      STAGING_OWNER_B_EMAIL: randevu-staging-owner-b@example.com
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NOTIFICATION_FROM_EMAIL: randevu@notify.kepenk.ai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Install dependencies
        run: npm ci

      - name: Prepare ephemeral staging job secrets
        run: |
          node <<'NODE'
          const { randomBytes } = require('node:crypto');
          const { appendFileSync } = require('node:fs');

          const generated = {
            STAGING_OWNER_A_PASSWORD: `Rdv!${randomBytes(24).toString('base64url')}9a`,
            STAGING_OWNER_B_PASSWORD: `Rdv!${randomBytes(24).toString('base64url')}9a`,
            PUBLIC_BOOKING_GATE_SECRET: randomBytes(48).toString('base64url'),
            NOTIFICATION_DISPATCH_SECRET: randomBytes(48).toString('base64url'),
          };

          for (const [name, value] of Object.entries(generated)) {
            process.stdout.write(`::add-mask::${value}\n`);
            appendFileSync(process.env.GITHUB_ENV, `${name}=${value}\n`, 'utf8');
          }
          NODE

      - name: Validate staging external contract
        run: |
          node <<'NODE'
          const requiredExternal = [
            'CLOUDFLARE_API_TOKEN', 'SUPABASE_DB_PASSWORD',
            'SUPABASE_ADMIN_KEY', 'RESEND_API_KEY',
          ];
          const missingExternal = requiredExternal.filter((name) => !process.env[name]);
          if (missingExternal.length) {
            throw new Error(`Missing staging external settings: ${missingExternal.join(', ')}`);
          }

          const requiredWorkflow = [
            'STAGING_SUPABASE_PROJECT_REF', 'STAGING_SUPABASE_POOLER_HOST',
            'SUPABASE_URL', 'SUPABASE_ANON_KEY',
            'STAGING_OWNER_A_EMAIL', 'STAGING_OWNER_A_PASSWORD',
            'STAGING_OWNER_B_EMAIL', 'STAGING_OWNER_B_PASSWORD',
            'PUBLIC_BOOKING_GATE_SECRET', 'NOTIFICATION_DISPATCH_SECRET',
            'NOTIFICATION_FROM_EMAIL',
          ];
          const missingWorkflow = requiredWorkflow.filter((name) => !process.env[name]);
          if (missingWorkflow.length) {
            throw new Error(`Missing workflow-provided staging settings: ${missingWorkflow.join(', ')}`);
          }
          const projectRef = process.env.STAGING_SUPABASE_PROJECT_REF;
          if (!process.env.SUPABASE_URL.includes(projectRef)) {
            throw new Error('Supabase API URL and project ref do not describe the same staging project');
          }
          if (!process.env.SUPABASE_ANON_KEY.startsWith('sb_publishable_')) {
            throw new Error('Staging API key must use the hosted Supabase publishable-key model');
          }
          if (process.env.NOTIFICATION_FROM_EMAIL !== 'randevu@notify.kepenk.ai') {
            throw new Error('Staging notification sender must use the dedicated notify.kepenk.ai domain');
          }
          for (const name of ['PUBLIC_BOOKING_GATE_SECRET', 'NOTIFICATION_DISPATCH_SECRET']) {
            const value = process.env[name] ?? '';
            if (value.length < 43 || value.length > 256) {
              throw new Error(`${name} must satisfy the Worker secret length contract`);
            }
          }
          NODE

      - name: Build staging database URL
        run: |
          node <<'NODE'
          const { appendFileSync } = require('node:fs');

          const projectRef = process.env.STAGING_SUPABASE_PROJECT_REF;
          const host = process.env.STAGING_SUPABASE_POOLER_HOST;
          const password = process.env.SUPABASE_DB_PASSWORD ?? '';
          if (!password) throw new Error('SUPABASE_DB_PASSWORD is empty');

          const user = `postgres.${projectRef}`;
          const encodedPassword = encodeURIComponent(password);
          const databaseUrl = `postgresql://${user}:${encodedPassword}@${host}:5432/postgres?sslmode=require`;
          new URL(databaseUrl);

          process.stdout.write(`::add-mask::${databaseUrl}\n`);
          appendFileSync(process.env.GITHUB_ENV, `STAGING_DATABASE_URL=${databaseUrl}\n`, 'utf8');
          console.log(`Prepared staging database endpoint for ${user} via session pooler.`);
          NODE

      - name: Resolve Cloudflare account
        run: |
          umask 077
          npx wrangler whoami --json > /tmp/randevu-cloudflare-whoami.json
          node <<'NODE'
          const { appendFileSync, readFileSync, rmSync } = require('node:fs');
          const path = '/tmp/randevu-cloudflare-whoami.json';
          try {
            const payload = JSON.parse(readFileSync(path, 'utf8'));
            if (payload.loggedIn !== true) throw new Error('Wrangler did not authenticate with the staging Cloudflare token');
            const accounts = Array.isArray(payload.accounts) ? payload.accounts : [];
            if (accounts.length !== 1) {
              throw new Error(`Cloudflare staging token must expose exactly one account; received ${accounts.length}`);
            }
            const accountId = String(accounts[0]?.id ?? accounts[0]?.accountId ?? '').trim();
            if (!/^[a-f0-9]{32}$/i.test(accountId)) throw new Error('Wrangler returned an invalid Cloudflare account ID');
            appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_ACCOUNT_ID=${accountId}\n`, 'utf8');
            console.log(`Resolved Cloudflare account: ${accountId.slice(0, 6)}…`);
          } finally {
            rmSync(path, { force: true });
          }
          NODE

      - name: Build Cloudflare staging environment
        run: npm run build:staging

      - name: Resolve Cloudflare staging runtime
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';
          import { appendFileSync, readFileSync } from 'node:fs';

          const generated = JSON.parse(readFileSync('dist/yzt_randevu/wrangler.json', 'utf8'));
          const workerName = String(generated.name ?? '').trim();
          if (!workerName) throw new Error('Generated staging Wrangler config has no Worker name');
          if (generated.workers_dev !== true) throw new Error('Generated staging Wrangler config must enable workers_dev');

          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` };
          const subdomainResponse = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/subdomain`,
            { headers },
          );
          const subdomainPayload = await subdomainResponse.json().catch(() => null);
          const subdomain = String(subdomainPayload?.result?.subdomain ?? '').trim();
          if (!subdomainResponse.ok || subdomainPayload?.success !== true || !subdomain) {
            throw new Error(`Cloudflare Workers subdomain lookup failed with HTTP ${subdomainResponse.status}`);
          }

          const origin = `https://${workerName}.${subdomain}.workers.dev`;
          new URL(origin);
          appendFileSync(process.env.GITHUB_ENV, `STAGING_WORKER_NAME=${workerName}\n`, 'utf8');
          appendFileSync(process.env.GITHUB_ENV, `STAGING_APP_ORIGIN=${origin}\n`, 'utf8');
          console.log(`Resolved staging origin: ${origin}`);

          const secretUrl = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${encodeURIComponent(workerName)}/secrets/MANAGEMENT_LINK_ENCRYPTION_KEY_V1`;
          const secretResponse = await fetch(secretUrl, { headers });
          const secretPayload = await secretResponse.json().catch(() => null);

          if (secretResponse.ok && secretPayload?.success === true && secretPayload?.result?.name === 'MANAGEMENT_LINK_ENCRYPTION_KEY_V1') {
            console.log('Persistent management encryption key is already configured in Cloudflare.');
          } else if (secretResponse.status === 404) {
            const bootstrapKey = randomBytes(32).toString('base64url');
            process.stdout.write(`::add-mask::${bootstrapKey}\n`);
            appendFileSync(process.env.GITHUB_ENV, `MANAGEMENT_LINK_ENCRYPTION_KEY_V1_BOOTSTRAP=${bootstrapKey}\n`, 'utf8');
            console.log('Persistent management encryption key will be bootstrapped on this deploy.');
          } else {
            throw new Error(`Cloudflare management secret lookup failed with HTTP ${secretResponse.status}`);
          }
          NODE

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Verify staging database credentials
        env:
          PGCONNECT_TIMEOUT: '10'
        run: psql "$STAGING_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "select current_database(), current_user"

      - name: Apply staging migrations
        run: supabase db push --db-url "$STAGING_DATABASE_URL" --include-all --yes

      - name: Ensure real staging Auth owners
        id: owners
        run: node scripts/staging-ensure-users.mjs

      - name: Provision staging DB runtime hashes
        run: npm run staging:config

      - name: Reset staging fixture
        run: npm run staging:reset

      - name: Seed two-business staging fixture
        env:
          STAGING_OWNER_A_ID: ${{ steps.owners.outputs.owner_a }}
          STAGING_OWNER_B_ID: ${{ steps.owners.outputs.owner_b }}
        run: npm run staging:seed

      - name: Build temporary Worker secret bundle
        run: |
          umask 077
          node <<'NODE'
          const fs = require('node:fs');
          const payload = {
            SUPABASE_URL: process.env.SUPABASE_URL,
            SUPABASE_ANON_KEY: process.env.SUPABASE_ANON_KEY,
            COOKIE_SECURE: 'true',
            PUBLIC_BOOKING_GATE_SECRET: process.env.PUBLIC_BOOKING_GATE_SECRET,
            NOTIFICATION_DISPATCH_SECRET: process.env.NOTIFICATION_DISPATCH_SECRET,
            RESEND_API_KEY: process.env.RESEND_API_KEY,
            NOTIFICATION_FROM_EMAIL: process.env.NOTIFICATION_FROM_EMAIL,
            PUBLIC_APP_ORIGIN: process.env.STAGING_APP_ORIGIN,
          };
          if (process.env.MANAGEMENT_LINK_ENCRYPTION_KEY_V1_BOOTSTRAP) {
            payload.MANAGEMENT_LINK_ENCRYPTION_KEY_V1 = process.env.MANAGEMENT_LINK_ENCRYPTION_KEY_V1_BOOTSTRAP;
          }
          fs.writeFileSync('/tmp/randevu-staging-secrets.json', JSON.stringify(payload), { mode: 0o600 });
          NODE

      - name: Deploy Cloudflare staging Worker
        run: npx wrangler deploy --secrets-file /tmp/randevu-staging-secrets.json

      - name: Verify persistent management secret
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${encodeURIComponent(process.env.STAGING_WORKER_NAME)}/secrets/MANAGEMENT_LINK_ENCRYPTION_KEY_V1`,
            { headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } },
          );
          const payload = await response.json().catch(() => null);
          if (!response.ok || payload?.success !== true || payload?.result?.name !== 'MANAGEMENT_LINK_ENCRYPTION_KEY_V1') {
            throw new Error(`Persistent management secret verification failed with HTTP ${response.status}`);
          }
          console.log('Persistent management encryption key binding verified.');
          NODE

      - name: Verify real staging login and catalog
        run: npm run staging:smoke

      - name: Remove temporary Worker secret bundle
        if: always()
        run: rm -f /tmp/randevu-staging-secrets.json /tmp/randevu-cloudflare-whoami.json
