name: Staging deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: randevu-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_ADMIN_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
      STAGING_OWNER_A_EMAIL: ${{ secrets.STAGING_OWNER_A_EMAIL }}
      STAGING_OWNER_A_PASSWORD: ${{ secrets.STAGING_OWNER_A_PASSWORD }}
      STAGING_OWNER_B_EMAIL: ${{ secrets.STAGING_OWNER_B_EMAIL }}
      STAGING_OWNER_B_PASSWORD: ${{ secrets.STAGING_OWNER_B_PASSWORD }}
      MANAGEMENT_LINK_ENCRYPTION_KEY_V1: ${{ secrets.MANAGEMENT_LINK_ENCRYPTION_KEY_V1 }}
      PUBLIC_BOOKING_GATE_SECRET: ${{ secrets.PUBLIC_BOOKING_GATE_SECRET }}
      NOTIFICATION_DISPATCH_SECRET: ${{ secrets.NOTIFICATION_DISPATCH_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NOTIFICATION_FROM_EMAIL: ${{ secrets.NOTIFICATION_FROM_EMAIL }}
      STAGING_APP_ORIGIN: ${{ secrets.STAGING_APP_ORIGIN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Install dependencies
        run: npm ci

      - name: Validate staging secret contract
        run: |
          node <<'NODE'
          const required = [
            'CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'STAGING_DATABASE_URL',
            'STAGING_SUPABASE_PROJECT_REF', 'SUPABASE_URL', 'SUPABASE_ANON_KEY', 'SUPABASE_ADMIN_KEY',
            'STAGING_OWNER_A_EMAIL', 'STAGING_OWNER_A_PASSWORD', 'STAGING_OWNER_B_EMAIL', 'STAGING_OWNER_B_PASSWORD',
            'MANAGEMENT_LINK_ENCRYPTION_KEY_V1', 'PUBLIC_BOOKING_GATE_SECRET', 'NOTIFICATION_DISPATCH_SECRET',
            'RESEND_API_KEY', 'NOTIFICATION_FROM_EMAIL', 'STAGING_APP_ORIGIN',
          ];
          const missing = required.filter((name) => !process.env[name]);
          if (missing.length) throw new Error(`Missing staging settings: ${missing.join(', ')}`);
          if (!process.env.STAGING_APP_ORIGIN.startsWith('https://')) {
            throw new Error('STAGING_APP_ORIGIN must use HTTPS');
          }
          const projectRef = process.env.STAGING_SUPABASE_PROJECT_REF;
          if (!process.env.SUPABASE_URL.includes(projectRef) || !process.env.STAGING_DATABASE_URL.includes(projectRef)) {
            throw new Error('Supabase API URL, database URL and project ref do not describe the same staging project');
          }
          NODE

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply staging migrations
        run: supabase db push --db-url "$STAGING_DATABASE_URL" --include-all --yes

      - name: Ensure real staging Auth owners
        id: owners
        run: node scripts/staging-ensure-users.mjs

      - name: Provision staging DB runtime hashes
        run: npm run staging:config

      - name: Reset staging fixture
        run: npm run staging:reset

      - name: Seed two-business staging fixture
        env:
          STAGING_OWNER_A_ID: ${{ steps.owners.outputs.owner_a }}
          STAGING_OWNER_B_ID: ${{ steps.owners.outputs.owner_b }}
        run: npm run staging:seed

      - name: Build Cloudflare staging environment
        run: npm run build:staging

      - name: Build temporary Worker secret bundle
        run: |
          umask 077
          node <<'NODE'
          const fs = require('node:fs');
          const payload = {
            SUPABASE_URL: process.env.SUPABASE_URL,
            SUPABASE_ANON_KEY: process.env.SUPABASE_ANON_KEY,
            COOKIE_SECURE: 'true',
            MANAGEMENT_LINK_ENCRYPTION_KEY_V1: process.env.MANAGEMENT_LINK_ENCRYPTION_KEY_V1,
            PUBLIC_BOOKING_GATE_SECRET: process.env.PUBLIC_BOOKING_GATE_SECRET,
            NOTIFICATION_DISPATCH_SECRET: process.env.NOTIFICATION_DISPATCH_SECRET,
            RESEND_API_KEY: process.env.RESEND_API_KEY,
            NOTIFICATION_FROM_EMAIL: process.env.NOTIFICATION_FROM_EMAIL,
            PUBLIC_APP_ORIGIN: process.env.STAGING_APP_ORIGIN,
          };
          fs.writeFileSync('/tmp/randevu-staging-secrets.json', JSON.stringify(payload), { mode: 0o600 });
          NODE

      - name: Deploy Cloudflare staging Worker
        run: npx wrangler deploy --secrets-file /tmp/randevu-staging-secrets.json

      - name: Verify real staging login and catalog
        run: npm run staging:smoke

      - name: Remove temporary Worker secret bundle
        if: always()
        run: rm -f /tmp/randevu-staging-secrets.json
