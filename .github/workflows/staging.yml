name: Staging deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: randevu-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_SUPABASE_PROJECT_REF: smizhsagjpqexveitbqu
      SUPABASE_URL: https://smizhsagjpqexveitbqu.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_smh_KUbC7hv3fhTEX21xXQ_zzn6qZnY
      SUPABASE_ADMIN_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
      STAGING_OWNER_A_EMAIL: randevu-staging-owner-a@example.com
      STAGING_OWNER_B_EMAIL: randevu-staging-owner-b@example.com
      MANAGEMENT_LINK_ENCRYPTION_KEY_V1: ${{ secrets.MANAGEMENT_LINK_ENCRYPTION_KEY_V1 }}
      PUBLIC_BOOKING_GATE_SECRET: ${{ secrets.PUBLIC_BOOKING_GATE_SECRET }}
      NOTIFICATION_DISPATCH_SECRET: ${{ secrets.NOTIFICATION_DISPATCH_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NOTIFICATION_FROM_EMAIL: ${{ secrets.NOTIFICATION_FROM_EMAIL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Install dependencies
        run: npm ci

      - name: Prepare ephemeral staging owner passwords
        run: |
          node <<'NODE'
          const { randomBytes } = require('node:crypto');
          const { appendFileSync } = require('node:fs');
          for (const name of ['STAGING_OWNER_A_PASSWORD', 'STAGING_OWNER_B_PASSWORD']) {
            const value = `Rdv!${randomBytes(24).toString('base64url')}9a`;
            process.stdout.write(`::add-mask::${value}\n`);
            appendFileSync(process.env.GITHUB_ENV, `${name}=${value}\n`, 'utf8');
          }
          NODE

      - name: Validate staging external contract
        run: |
          node <<'NODE'
          const requiredExternal = [
            'CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'STAGING_DATABASE_URL',
            'SUPABASE_ADMIN_KEY', 'MANAGEMENT_LINK_ENCRYPTION_KEY_V1',
            'PUBLIC_BOOKING_GATE_SECRET', 'NOTIFICATION_DISPATCH_SECRET',
            'RESEND_API_KEY', 'NOTIFICATION_FROM_EMAIL',
          ];
          const missingExternal = requiredExternal.filter((name) => !process.env[name]);
          if (missingExternal.length) {
            throw new Error(`Missing staging external settings: ${missingExternal.join(', ')}`);
          }

          const requiredWorkflow = [
            'STAGING_SUPABASE_PROJECT_REF', 'SUPABASE_URL', 'SUPABASE_ANON_KEY',
            'STAGING_OWNER_A_EMAIL', 'STAGING_OWNER_A_PASSWORD',
            'STAGING_OWNER_B_EMAIL', 'STAGING_OWNER_B_PASSWORD',
          ];
          const missingWorkflow = requiredWorkflow.filter((name) => !process.env[name]);
          if (missingWorkflow.length) {
            throw new Error(`Missing workflow-provided staging settings: ${missingWorkflow.join(', ')}`);
          }
          const projectRef = process.env.STAGING_SUPABASE_PROJECT_REF;
          if (!process.env.SUPABASE_URL.includes(projectRef) || !process.env.STAGING_DATABASE_URL.includes(projectRef)) {
            throw new Error('Supabase API URL, database URL and project ref do not describe the same staging project');
          }
          if (!process.env.SUPABASE_ANON_KEY.startsWith('sb_publishable_')) {
            throw new Error('Staging Worker must use the hosted Supabase publishable key');
          }
          NODE

      - name: Build Cloudflare staging environment
        run: npm run build:staging

      - name: Resolve Cloudflare staging origin
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const generated = JSON.parse(readFileSync('dist/yzt_randevu/wrangler.json', 'utf8'));
          const workerName = String(generated.name ?? '').trim();
          if (!workerName) throw new Error('Generated staging Wrangler config has no Worker name');
          if (generated.workers_dev !== true) throw new Error('Generated staging Wrangler config must enable workers_dev');

          const response = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/subdomain`,
            { headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } },
          );
          const payload = await response.json().catch(() => null);
          const subdomain = String(payload?.result?.subdomain ?? '').trim();
          if (!response.ok || payload?.success !== true || !subdomain) {
            throw new Error(`Cloudflare Workers subdomain lookup failed with HTTP ${response.status}`);
          }

          const origin = `https://${workerName}.${subdomain}.workers.dev`;
          new URL(origin);
          appendFileSync(process.env.GITHUB_ENV, `STAGING_APP_ORIGIN=${origin}\n`, 'utf8');
          console.log(`Resolved staging origin: ${origin}`);
          NODE

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply staging migrations
        run: supabase db push --db-url "$STAGING_DATABASE_URL" --include-all --yes

      - name: Ensure real staging Auth owners
        id: owners
        run: node scripts/staging-ensure-users.mjs

      - name: Provision staging DB runtime hashes
        run: npm run staging:config

      - name: Reset staging fixture
        run: npm run staging:reset

      - name: Seed two-business staging fixture
        env:
          STAGING_OWNER_A_ID: ${{ steps.owners.outputs.owner_a }}
          STAGING_OWNER_B_ID: ${{ steps.owners.outputs.owner_b }}
        run: npm run staging:seed

      - name: Build temporary Worker secret bundle
        run: |
          umask 077
          node <<'NODE'
          const fs = require('node:fs');
          const payload = {
            SUPABASE_URL: process.env.SUPABASE_URL,
            SUPABASE_ANON_KEY: process.env.SUPABASE_ANON_KEY,
            COOKIE_SECURE: 'true',
            MANAGEMENT_LINK_ENCRYPTION_KEY_V1: process.env.MANAGEMENT_LINK_ENCRYPTION_KEY_V1,
            PUBLIC_BOOKING_GATE_SECRET: process.env.PUBLIC_BOOKING_GATE_SECRET,
            NOTIFICATION_DISPATCH_SECRET: process.env.NOTIFICATION_DISPATCH_SECRET,
            RESEND_API_KEY: process.env.RESEND_API_KEY,
            NOTIFICATION_FROM_EMAIL: process.env.NOTIFICATION_FROM_EMAIL,
            PUBLIC_APP_ORIGIN: process.env.STAGING_APP_ORIGIN,
          };
          fs.writeFileSync('/tmp/randevu-staging-secrets.json', JSON.stringify(payload), { mode: 0o600 });
          NODE

      - name: Deploy Cloudflare staging Worker
        run: npx wrangler deploy --secrets-file /tmp/randevu-staging-secrets.json

      - name: Verify real staging login and catalog
        run: npm run staging:smoke

      - name: Remove temporary Worker secret bundle
        if: always()
        run: rm -f /tmp/randevu-staging-secrets.json
