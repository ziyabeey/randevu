name: Staging deploy

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy preserves keys; rotate requires S05 baseline; resume/rollback recover a pending rotation
        required: true
        default: deploy
        type: choice
        options: [deploy, rotate, resume, rollback, bootstrap]
      run_f09_acceptance:
        description: Run real F09-05 booking and Resend delivery gate
        required: false
        default: false
        type: boolean
      run_f10_auth_acceptance:
        description: Run hosted F10 auth gate and F10-02 two-account team gate
        required: false
        default: false
        type: boolean
      run_f10_team_acceptance:
        description: Run real F10-02 two-account invitation, role and permission gate
        required: false
        default: false
        type: boolean
      run_f16_sms_acceptance:
        description: Run real F16-02 Twilio SMS delivery gate
        required: false
        default: false
        type: boolean
      run_s01_acceptance:
        description: Run S01 public mailbox recovery boundary
        required: false
        default: false
        type: boolean
      s01_recovery_email:
        description: Resend Receiving test mailbox for S01
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: randevu-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    env:
      STAGING_OPERATION: ${{ inputs.operation }}
      RUN_F09_ACCEPTANCE: ${{ inputs.run_f09_acceptance || inputs.operation == 'rotate' || inputs.operation == 'resume' }}
      RUN_F10_ACCEPTANCE: ${{ inputs.run_f10_auth_acceptance }}
      RUN_F10_TEAM_ACCEPTANCE: ${{ inputs.run_f10_team_acceptance || inputs.run_f10_auth_acceptance }}
      RUN_F16_SMS_ACCEPTANCE: ${{ inputs.run_f16_sms_acceptance }}
      RUN_S01_ACCEPTANCE: ${{ inputs.run_s01_acceptance }}
      S01_RECOVERY_EMAIL: ${{ inputs.s01_recovery_email }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      STAGING_SUPABASE_PROJECT_REF: smizhsagjpqexveitbqu
      STAGING_SUPABASE_POOLER_HOST: aws-0-eu-central-1.pooler.supabase.com
      SUPABASE_URL: https://smizhsagjpqexveitbqu.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_smh_KUbC7hv3fhTEX21xXQ_zzn6qZnY
      SUPABASE_ADMIN_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
      STAGING_OWNER_A_EMAIL: randevu-staging-owner-a@example.com
      STAGING_OWNER_B_EMAIL: randevu-staging-owner-b@example.com
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NOTIFICATION_FROM_EMAIL: randevu@notify.kepenk.ai
      NETGSM_USERCODE: ${{ secrets.NETGSM_USERCODE }}
      NETGSM_PASSWORD: ${{ secrets.NETGSM_PASSWORD }}
      NETGSM_MSGHEADER: ${{ secrets.NETGSM_MSGHEADER }}
      NETGSM_APPNAME: kepenk
      NETGSM_TEST_RECIPIENT: ${{ secrets.NETGSM_TEST_RECIPIENT }}
      NETGSM_SMS_SEGMENT_PRICE_TRY: ${{ vars.NETGSM_SMS_SEGMENT_PRICE_TRY }}
      TWILLO_ID: ${{ secrets.TWILLO_ID }}
      TWILLO_SECRET_API: ${{ secrets.TWILLO_SECRET_API }}
      TWILIO_TEST_RECIPIENT: ${{ secrets.TWILIO_TEST_RECIPIENT }}
      TWILIO_TRIAL_MODE: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Install dependencies
        run: npm ci

      - name: Verify F09 failure and recovery contracts
        if: ${{ inputs.run_f09_acceptance || inputs.operation == 'rotate' || inputs.operation == 'resume' }}
        env:
          RESEND_ACCEPTANCE_API_KEY: ${{ secrets.RESEND_ACCEPTANCE_API_KEY }}
        run: |
          if [ -z "$RESEND_ACCEPTANCE_API_KEY" ]; then
            echo "::error::F09 acceptance requires staging secret RESEND_ACCEPTANCE_API_KEY (Resend full_access)."
            exit 1
          fi
          npm run test:http

      - name: Verify F10 auth and request-security contracts
        if: ${{ inputs.run_f10_auth_acceptance }}
        run: npm run test:http

      - name: Verify F10 team access contracts
        if: ${{ inputs.run_f10_team_acceptance || inputs.run_f10_auth_acceptance }}
        run: npm run test:http

      - name: Verify S01 recovery contracts and mailbox input
        if: ${{ inputs.run_s01_acceptance }}
        env:
          RESEND_ACCEPTANCE_API_KEY: ${{ secrets.RESEND_ACCEPTANCE_API_KEY }}
          S01_RECOVERY_EMAIL: ${{ inputs.s01_recovery_email }}
        run: |
          if [ -z "$RESEND_ACCEPTANCE_API_KEY" ]; then
            echo "::error::S01 acceptance requires staging secret RESEND_ACCEPTANCE_API_KEY (Resend full_access)."
            exit 1
          fi
          if [ -z "$S01_RECOVERY_EMAIL" ]; then
            echo "::error::S01 acceptance requires a Resend Receiving test mailbox input."
            exit 1
          fi
          npm run test:http

      - name: Prepare ephemeral staging job secrets
        run: |
          node <<'NODE'
          const { randomBytes } = require('node:crypto');
          const { appendFileSync } = require('node:fs');

          const generated = {
            STAGING_OWNER_A_PASSWORD: `Rdv!${randomBytes(24).toString('base64url')}9a`,
            STAGING_OWNER_B_PASSWORD: `Rdv!${randomBytes(24).toString('base64url')}9a`,
          };

          for (const [name, value] of Object.entries(generated)) {
            process.stdout.write(`::add-mask::${value}\n`);
            appendFileSync(process.env.GITHUB_ENV, `${name}=${value}\n`, 'utf8');
          }
          NODE

      - name: Validate staging external contract
        run: |
          node <<'NODE'
          const requiredExternal = [
            'CLOUDFLARE_API_TOKEN', 'SUPABASE_DB_PASSWORD',
            'SUPABASE_ADMIN_KEY', 'RESEND_API_KEY',
          ];
          const missingExternal = requiredExternal.filter((name) => !process.env[name]);
          if (missingExternal.length) {
            throw new Error(`Missing staging external settings: ${missingExternal.join(', ')}`);
          }

          const netgsmRuntime = ['NETGSM_USERCODE', 'NETGSM_PASSWORD', 'NETGSM_MSGHEADER'];
          const configuredNetgsm = netgsmRuntime.filter((name) => Boolean(process.env[name])).length;
          if (configuredNetgsm !== 0 && configuredNetgsm !== netgsmRuntime.length) {
            throw new Error('NetGSM staging runtime credentials must be configured together');
          }
          const twilioRuntime = ['TWILLO_ID', 'TWILLO_SECRET_API'];
          const configuredTwilio = twilioRuntime.filter((name) => Boolean(process.env[name])).length;
          if (configuredTwilio !== 0 && configuredTwilio !== twilioRuntime.length) {
            throw new Error('Twilio staging runtime credentials must be configured together');
          }
          if (process.env.RUN_F16_SMS_ACCEPTANCE === 'true') {
            const f16Required = [
              ...twilioRuntime,
              'TWILIO_TEST_RECIPIENT',
            ];
            const missingF16 = f16Required.filter((name) => !process.env[name]);
            if (missingF16.length) {
              throw new Error(`F16 SMS acceptance missing staging settings: ${missingF16.join(', ')}`);
            }
          }

          const requiredWorkflow = [
            'STAGING_SUPABASE_PROJECT_REF', 'STAGING_SUPABASE_POOLER_HOST',
            'SUPABASE_URL', 'SUPABASE_ANON_KEY',
            'STAGING_OWNER_A_EMAIL', 'STAGING_OWNER_A_PASSWORD',
            'STAGING_OWNER_B_EMAIL', 'STAGING_OWNER_B_PASSWORD',
            'NOTIFICATION_FROM_EMAIL',
          ];
          const missingWorkflow = requiredWorkflow.filter((name) => !process.env[name]);
          if (missingWorkflow.length) {
            throw new Error(`Missing workflow-provided staging settings: ${missingWorkflow.join(', ')}`);
          }
          const projectRef = process.env.STAGING_SUPABASE_PROJECT_REF;
          if (!process.env.SUPABASE_URL.includes(projectRef)) {
            throw new Error('Supabase API URL and project ref do not describe the same staging project');
          }
          if (!process.env.SUPABASE_ANON_KEY.startsWith('sb_publishable_')) {
            throw new Error('Staging API key must use the hosted Supabase publishable-key model');
          }
          if (process.env.NOTIFICATION_FROM_EMAIL !== 'randevu@notify.kepenk.ai') {
            throw new Error('Staging notification sender must use the dedicated notify.kepenk.ai domain');
          }
          NODE

      - name: Build staging database URL
        run: |
          node <<'NODE'
          const { appendFileSync } = require('node:fs');

          const projectRef = process.env.STAGING_SUPABASE_PROJECT_REF;
          const host = process.env.STAGING_SUPABASE_POOLER_HOST;
          const password = process.env.SUPABASE_DB_PASSWORD ?? '';
          if (!password) throw new Error('SUPABASE_DB_PASSWORD is empty');

          const user = `postgres.${projectRef}`;
          const encodedPassword = encodeURIComponent(password);
          const databaseUrl = `postgresql://${user}:${encodedPassword}@${host}:5432/postgres?sslmode=require`;
          new URL(databaseUrl);

          process.stdout.write(`::add-mask::${databaseUrl}\n`);
          appendFileSync(process.env.GITHUB_ENV, `STAGING_DATABASE_URL=${databaseUrl}\n`, 'utf8');
          console.log(`Prepared staging database endpoint for ${user} via session pooler.`);
          NODE

      - name: Resolve Cloudflare account
        run: |
          umask 077
          npx wrangler whoami --json > /tmp/randevu-cloudflare-whoami.json
          node <<'NODE'
          const { appendFileSync, readFileSync, rmSync } = require('node:fs');
          const path = '/tmp/randevu-cloudflare-whoami.json';
          try {
            const payload = JSON.parse(readFileSync(path, 'utf8'));
            if (payload.loggedIn !== true) throw new Error('Wrangler did not authenticate with the staging Cloudflare token');
            const accounts = Array.isArray(payload.accounts) ? payload.accounts : [];
            if (accounts.length !== 1) {
              throw new Error(`Cloudflare staging token must expose exactly one account; received ${accounts.length}`);
            }
            const accountId = String(accounts[0]?.id ?? accounts[0]?.accountId ?? '').trim();
            if (!/^[a-f0-9]{32}$/i.test(accountId)) throw new Error('Wrangler returned an invalid Cloudflare account ID');
            appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_ACCOUNT_ID=${accountId}\n`, 'utf8');
            console.log(`Resolved Cloudflare account: ${accountId.slice(0, 6)}…`);
          } finally {
            rmSync(path, { force: true });
          }
          NODE

      - name: Build Cloudflare staging environment
        run: npm run build:staging

      - name: Resolve Cloudflare staging runtime
        run: node scripts/staging-deploy.mjs resolve

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Verify staging database credentials
        env:
          PGCONNECT_TIMEOUT: '10'
        run: psql "$STAGING_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "select current_database(), current_user"

      - name: Apply staging migrations
        run: supabase db push --db-url "$STAGING_DATABASE_URL" --include-all --yes

      - name: Ensure real staging Auth owners
        id: owners
        run: node scripts/staging-ensure-users.mjs

      - name: Deploy and verify consistent staging generation
        env:
          STAGING_OWNER_A_ID: ${{ steps.owners.outputs.owner_a }}
          STAGING_OWNER_B_ID: ${{ steps.owners.outputs.owner_b }}
          RESEND_ACCEPTANCE_API_KEY: ${{ secrets.RESEND_ACCEPTANCE_API_KEY }}
        run: node scripts/staging-deploy.mjs

      - name: Remove temporary Worker secret bundle
        if: always()
        run: rm -f /tmp/randevu-staging-secrets.json /tmp/randevu-cloudflare-whoami.json
