name: CI

on:
  push:
    branches: [main]
  # Includes stacked PRs; no source-branch or path filters.
  pull_request:
  # Qwen-created branches can dispatch the same authoritative gate explicitly.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # One fixed required job avoids per-job runner startup/billing overhead.
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve trusted prior full-code CI receipts
        if: ${{ github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize') }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CURRENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CURRENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          receipts="${RUNNER_TEMP}/trusted-ci-receipts.json"
          runs_raw="${RUNNER_TEMP}/trusted-ci-runs.raw.json"
          candidates="${RUNNER_TEMP}/trusted-ci-candidates.tsv"
          printf '[]\n' > "${receipts}"
          : > "${candidates}"

          runs_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?status=success&per_page=100"
          if ! curl --fail --silent --show-error --connect-timeout 3 --max-time 10 \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${runs_url}" > "${runs_raw}"; then
            echo "Prior CI lookup unavailable; full code checks remain required."
            exit 0
          fi

          if ! jq -e '.workflow_runs | type == "array"' "${runs_raw}" >/dev/null 2>&1; then
            echo "Prior CI lookup returned an unexpected shape; full code checks remain required."
            exit 0
          fi

          # The broad successful-run page can be saturated by unrelated PR runs.
          # Query the exact current-main SHA separately so a valid docs-only baseline
          # cannot disappear merely because it fell off the first 100 results.
          base_runs_raw="${RUNNER_TEMP}/trusted-ci-base-runs.raw.json"
          base_runs_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=${CURRENT_BASE_SHA}&status=success&per_page=10"
          if curl --fail --silent --show-error --connect-timeout 3 --max-time 10 \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${base_runs_url}" > "${base_runs_raw}" \
            && jq -e '.workflow_runs | type == "array"' "${base_runs_raw}" >/dev/null 2>&1; then
            jq -s '{workflow_runs: ((.[0].workflow_runs + .[1].workflow_runs) | unique_by(.id))}' \
              "${runs_raw}" "${base_runs_raw}" > "${runs_raw}.merged"
            mv "${runs_raw}.merged" "${runs_raw}"
          else
            echo "Exact current-main CI lookup unavailable; broad receipts remain advisory and full checks stay fail-closed."
          fi

          if ! jq -r --argjson pr "${PR_NUMBER}" \
            --arg head "${CURRENT_HEAD_SHA}" --arg base "${CURRENT_BASE_SHA}" \
            '[.workflow_runs[]
              | select(.head_sha != $head)
              | select((.event == "pull_request" and any(.pull_requests[]?; .number == $pr))
                or (.event == "push" and .head_branch == "main" and .head_sha == $base))
              | [.id, .head_sha, (if .event == "push" then "main-push" else "pr-full" end)]]
             | .[:20][]
             | @tsv' "${runs_raw}" > "${candidates}"; then
            echo "Prior CI candidate parsing failed; full code checks remain required."
            exit 0
          fi

          while IFS=$'\t' read -r run_id head_sha origin; do
            [ -n "${run_id}" ] || continue
            [ -n "${head_sha}" ] || continue
            jobs_raw="${RUNNER_TEMP}/trusted-ci-jobs-${run_id}.json"
            jobs_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100"

            if ! curl --fail --silent --show-error --connect-timeout 3 --max-time 10 \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${jobs_url}" > "${jobs_raw}"; then
              continue
            fi

            if ! jq -e --arg origin "${origin}" '
              (.jobs | type == "array")
              and any(.jobs[]?;
                .name == "CI gate"
                and .conclusion == "success"
                and any(.steps[]?;
                  .name == "Run all required code checks"
                  and (.conclusion == "success" or ($origin == "main-push" and .conclusion == "skipped")))
                and any(.steps[]?;
                  .name == "Check documentation and task graph" and .conclusion == "success")
                and any(.steps[]?;
                  .name == "Require the selected checks to complete"
                  and .conclusion == "success"))
            ' "${jobs_raw}" >/dev/null 2>&1; then
              continue
            fi

            jq --arg head "${head_sha}" --arg origin "${origin}" --argjson run "${run_id}" \
              '. + [{headSha: $head, runId: $run, origin: $origin}]' \
              "${receipts}" > "${receipts}.next"
            mv "${receipts}.next" "${receipts}"
          done < "${candidates}"

      - uses: actions/checkout@v4
        with:
          # Pull-request CI is exact-head evidence. Avoid GitHub's synthetic
          # refs/pull/<n>/merge checkout, whose SHA can move independently of
          # the candidate identity consumed by Dispatcher/review automation.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Select required checks
        id: scope
        env:
          TRUSTED_CI_RECEIPTS_FILE: ${{ runner.temp }}/trusted-ci-receipts.json
        run: node scripts/ci-scope.mjs
      - name: Check documentation and task graph
        id: docs
        run: node scripts/ci-docs.mjs
      - name: Install dependencies while launching PostgreSQL 17
        if: ${{ steps.scope.outputs.mode == 'code' }}
        timeout-minutes: 3
        run: |
          set -euo pipefail
          pg_launch_log="${RUNNER_TEMP}/postgres-launch.log"
          docker run --detach --name randevu-ci-postgres \
            --env POSTGRES_PASSWORD=postgres --env POSTGRES_DB=yzt_test \
            --publish 127.0.0.1:5432:5432 \
            --health-cmd='pg_isready -U postgres -d yzt_test' \
            --health-interval=1s --health-timeout=3s --health-retries=30 postgres:17 \
            >"${RUNNER_TEMP}/postgres-container-id" 2>"${pg_launch_log}" &
          pg_launch_pid=$!

          npm ci

          if ! wait "${pg_launch_pid}"; then
            cat "${pg_launch_log}" >&2 || true
            echo 'PostgreSQL 17 container launch failed.' >&2
            exit 1
          fi

          # ubuntu-24.04 hosted runners currently ship psql already. Keep a
          # fail-safe fallback for future runner-image drift instead of paying
          # apt update/install on every green run.
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Verify disposable PostgreSQL 17 readiness
        if: ${{ steps.scope.outputs.mode == 'code' }}
        timeout-minutes: 1
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' randevu-ci-postgres)" = healthy ]; then
              server_version_num="$(psql -h 127.0.0.1 -U postgres -d yzt_test -Atqc 'show server_version_num')"
              case "${server_version_num}" in
                17*) exit 0 ;;
                *) echo "Expected PostgreSQL 17, got server_version_num=${server_version_num}" >&2; exit 1 ;;
              esac
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/postgres-launch.log" >&2 || true
          echo 'Test PostgreSQL did not become healthy.'
          exit 1
      - name: Run all required code checks
        id: verify
        if: ${{ steps.scope.outputs.mode == 'code' }}
        env:
          PGPASSWORD: postgres
        run: node scripts/ci-code.mjs
      - name: Run H19 Kit foundation smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm run test:h19-kit
      - name: Install H19 Kit M1 parser dependency
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm install --prefix tools/h19-kit --ignore-scripts --no-audit --no-fund --install-strategy=linked
      - name: Run H19 Kit M1 repository-intelligence smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:m1
      - name: Run H19 Kit M2 static-evidence smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:m2
      - name: Run H19 Kit M3 experiment-engine smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:m3
      - name: Run H19 Kit M3.5 impact-graph smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:m35
      - name: Run H19 Kit M3.5 SCIP cache smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:m35-cache
      - name: Run H19 Kit M3.5 affected-project smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:m35-affected
      - name: Run H19 Kit M3.5 normalized graph-cache smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:m35-graph-cache
      - name: Run H19 Kit M3.5 Tree-sitter fallback smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:m35-tree-sitter
      - name: Run H19 Kit M3.5 unit-symbol mapping smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:m35-unit-symbol
      - name: Run H19 Kit M4 change-impact orchestrator smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:m4-change-impact
      - name: Run H19 Kit M5 coverage-discovery smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:m5-coverage-discovery
      - name: Run H19 Kit M5 coverage validation-packet smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:m5-validation-packet
      - name: Run H19 Kit M6 minimal test-spec smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:m6-test-spec
      - name: Run H19 Kit M7 executable test-candidate smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:m7-test-candidate
      - name: Run H19 Kit M8 relational evidence smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:m8-relational
      - name: Run H19 Kit M9 relational case-composer smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:m9-relational-composer
      - name: Run H19 Kit M10 relational judgment-batch smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:m10-relational-judgment-batch
      - name: Run H19 Kit M11 offline materializer smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:m11-materializer
      - name: Run H19 Kit M11 observation collection smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:m11-collection
      - name: Run H19 Kit M11 dependency closure smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:m11-closure
      - name: Run H19 Kit M11 saved-observation bridge smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:m11-bridge
      - name: Run H19 Kit M11 targeted-validation receipt smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:m11-validation
      - name: Run H19 Kit M11 development-supplement receipt smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:m11-supplement
      - name: Run H19 Kit M11 notification-validation freeze smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:m11-notification-freeze
      - name: Run H19 Kit M11 notification saved-result replay
        if: ${{ steps.scope.outputs.mode == 'code' && hashFiles('tools/h19-kit/experiments/m11/notification-validation-001/RESULT.json') != '' }}
        run: npm --prefix tools/h19-kit run test:m11-notification-result
      - name: Run H19 Kit M11 notification empirical validation once
        id: h19_m11_notification_validation
        if: ${{ steps.scope.outputs.mode == 'code' && github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'h19-kit-m11-notification-behavioral-validation' && hashFiles('tools/h19-kit/experiments/m11/notification-validation-001/RESULT.json') == '' }}
        env:
          H19_M11_NOTIFICATION_SOURCE_REVISION: 07688ae08ef5c834bcadf5dc6a23c4e42e4621dd
          H19_M11_NOTIFICATION_PLAN_SHA256: 9478ae5199235075f1b142fab20de20222aa150a29a68c856239da1008855e3c
        run: |
          set -euo pipefail
          source_root="${RUNNER_TEMP}/h19-m11-notification-source"
          result="${RUNNER_TEMP}/h19-m11-notification-result.json"
          rm -rf "${source_root}"
          mkdir -p "${source_root}"
          git archive "${H19_M11_NOTIFICATION_SOURCE_REVISION}" | tar -x -C "${source_root}"
          node tools/h19-kit/bin/h19-m11-validate-notification.mjs \
            tools/h19-kit/experiments/m11 \
            tools/h19-kit/experiments/m11/notification-validation-001/PLAN.json \
            "${H19_M11_NOTIFICATION_PLAN_SHA256}" \
            "${source_root}" > "${result}"
          test -s "${result}"
      - name: Upload H19 Kit M11 notification empirical validation
        if: ${{ always() && steps.h19_m11_notification_validation.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: h19-m11-notification-validation-001
          path: ${{ runner.temp }}/h19-m11-notification-result.json
          if-no-files-found: error
      - name: Run H19 Kit performance-baseline smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:perf-baseline
      - name: Run H19 Kit TypeScript shard resolver smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:ts-shards
      - name: Run H19 Kit graph-equivalence smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:graph-equivalence
      - name: Run H19 Kit TypeScript evidence-graph adoption smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:ts-evidence-graph
      - name: Run H19 Kit public entrypoint smoke
        if: ${{ steps.scope.outputs.mode == 'code' }}
        run: npm --prefix tools/h19-kit run test:public-entrypoint
      - name: Install pinned SCIP TypeScript for performance baseline
        if: ${{ steps.scope.outputs.mode == 'code' && github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'h19-kit-performance-') }}
        run: npm install --global @sourcegraph/scip-typescript@0.4.0
      - name: Set up Go for pinned SCIP decoder
        if: ${{ steps.scope.outputs.mode == 'code' && github.event_name == 'pull_request' && (github.event.pull_request.head.ref == 'h19-kit-performance-graph-equivalence' || github.event.pull_request.head.ref == 'h19-kit-performance-project-shard-adoption') }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false
      - name: Build pinned SCIP decoder
        if: ${{ steps.scope.outputs.mode == 'code' && github.event_name == 'pull_request' && (github.event.pull_request.head.ref == 'h19-kit-performance-graph-equivalence' || github.event.pull_request.head.ref == 'h19-kit-performance-project-shard-adoption') }}
        run: |
          set -euo pipefail
          repo_dir="${RUNNER_TEMP}/scip-code"
          mkdir -p "${repo_dir}"
          git -C "${repo_dir}" init
          git -C "${repo_dir}" remote add origin https://github.com/scip-code/scip.git
          git -C "${repo_dir}" fetch --depth=1 origin db62094c7f9d464d0a6d9fd7815fcf3c9214b4c2
          git -C "${repo_dir}" checkout --detach FETCH_HEAD
          (
            cd "${repo_dir}"
            go build -o "${RUNNER_TEMP}/scip-h19" ./cmd/scip
          )
          "${RUNNER_TEMP}/scip-h19" --version
      - name: Measure H19 Kit performance baseline
        id: h19_perf_baseline
        if: ${{ steps.scope.outputs.mode == 'code' && github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'h19-kit-performance-') }}
        run: npm --prefix tools/h19-kit run perf:baseline -- --repo "${GITHUB_WORKSPACE}" --out "${RUNNER_TEMP}/h19-perf-baseline.json" --require-scip
      - name: Upload H19 Kit performance baseline
        if: ${{ always() && steps.h19_perf_baseline.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: h19-performance-baseline
          path: ${{ runner.temp }}/h19-perf-baseline.json
          if-no-files-found: error
      - name: Measure H19 Kit SCIP graph equivalence
        id: h19_graph_equivalence
        if: ${{ steps.scope.outputs.mode == 'code' && github.event_name == 'pull_request' && (github.event.pull_request.head.ref == 'h19-kit-performance-graph-equivalence' || github.event.pull_request.head.ref == 'h19-kit-performance-project-shard-adoption') }}
        run: npm --prefix tools/h19-kit run perf:graph-equivalence -- --repo "${GITHUB_WORKSPACE}" --out "${RUNNER_TEMP}/h19-graph-equivalence.json" --scip "${RUNNER_TEMP}/scip-h19" --scip-typescript-version 0.4.0
      - name: Upload H19 Kit SCIP graph equivalence
        if: ${{ always() && steps.h19_graph_equivalence.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: h19-graph-equivalence
          path: ${{ runner.temp }}/h19-graph-equivalence.json
          if-no-files-found: error
      - name: Measure H19 Kit project-shard adoption
        id: h19_project_shard_adoption
        if: ${{ steps.scope.outputs.mode == 'code' && github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'h19-kit-performance-project-shard-adoption' }}
        run: npm --prefix tools/h19-kit run perf:project-shard-adoption -- --repo "${GITHUB_WORKSPACE}" --out "${RUNNER_TEMP}/h19-project-shard-adoption.json" --scip "${RUNNER_TEMP}/scip-h19" --decoder-id db62094c7f9d464d0a6d9fd7815fcf3c9214b4c2 --scip-typescript-version 0.4.0
      - name: Upload H19 Kit project-shard adoption
        if: ${{ always() && steps.h19_project_shard_adoption.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: h19-project-shard-adoption
          path: ${{ runner.temp }}/h19-project-shard-adoption.json
          if-no-files-found: error
      - name: Measure H19 Kit TypeScript shard performance
        id: h19_ts_shard_performance
        if: ${{ steps.scope.outputs.mode == 'code' && github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'h19-kit-performance-tsconfig-shards' }}
        run: npm --prefix tools/h19-kit run perf:ts-shards -- --repo "${GITHUB_WORKSPACE}" --out "${RUNNER_TEMP}/h19-ts-shard-performance.json" --scip-version 0.4.0
      - name: Upload H19 Kit TypeScript shard performance
        if: ${{ always() && steps.h19_ts_shard_performance.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: h19-ts-shard-performance
          path: ${{ runner.temp }}/h19-ts-shard-performance.json
          if-no-files-found: error
      - name: Require the selected checks to complete
        if: ${{ always() }}
        env:
          CI_MODE: ${{ steps.scope.outputs.mode }}
          CI_SCOPE_RESULT: ${{ steps.scope.outcome }}
          CI_DOCS_COMPLETE: ${{ steps.docs.outputs.complete }}
          CI_CODE_RESULT: ${{ steps.verify.outcome }}
          CI_CODE_COMPLETE: ${{ steps.verify.outputs.complete }}
        run: node scripts/ci-result.mjs
      - name: Remove disposable test database
        if: ${{ always() && steps.scope.outputs.mode == 'code' }}
        run: docker rm --force --volumes randevu-ci-postgres
