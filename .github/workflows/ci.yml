name: CI

on:
  push:
    branches: [main]
  # All PR source and target branches, including stacked review/acceptance PRs.
  # No path filter: every PR receives the same final check.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Scope and documents
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      docs_complete: ${{ steps.docs.outputs.complete }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Select required checks
        id: scope
        run: node scripts/ci-scope.mjs
      - name: Check documentation and task graph
        id: docs
        run: node scripts/ci-docs.mjs

  code:
    name: Code and PostgreSQL
    needs: scope
    if: ${{ needs.scope.outputs.mode == 'code' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      complete: ${{ steps.verify.outputs.complete }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yzt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d yzt_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies once
        run: npm ci
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run all required code checks
        id: verify
        env:
          PGPASSWORD: postgres
        run: node scripts/ci-code.mjs

  gate:
    name: CI gate
    if: ${{ always() }}
    needs: [scope, code]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require the selected checks to complete
        env:
          CI_MODE: ${{ needs.scope.outputs.mode }}
          CI_SCOPE_RESULT: ${{ needs.scope.result }}
          CI_DOCS_COMPLETE: ${{ needs.scope.outputs.docs_complete }}
          CI_CODE_RESULT: ${{ needs.code.result }}
          CI_CODE_COMPLETE: ${{ needs.code.outputs.complete }}
        run: node scripts/ci-result.mjs
