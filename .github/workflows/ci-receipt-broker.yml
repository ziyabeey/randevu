name: Trusted CI Receipt Broker

on:
  workflow_call:
    outputs:
      receipt_json:
        description: Sanitized authoritative full-code CI receipt candidates.
        value: ${{ jobs.lookup.outputs.receipt_json }}

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  lookup:
    name: Resolve authoritative full-code receipt
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      receipt_json: ${{ steps.lookup.outputs.receipt_json }}
    steps:
      - name: Checkout canonical trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve sanitized receipt
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-receipt-broker.mjs
