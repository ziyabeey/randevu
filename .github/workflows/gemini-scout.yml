name: Gemini Scout

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue or PR number to analyze'
        required: true
        type: string
      request:
        description: 'Scout request'
        required: true
        type: string
      issue_title:
        description: 'Target issue or PR title supplied by the command router'
        required: false
        type: string
      issue_body:
        description: 'Target issue or PR body supplied by the command router'
        required: false
        type: string

concurrency:
  group: gemini-scout-${{ inputs.issue_number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      REQUEST: ${{ inputs.request }}
      ISSUE_TITLE: ${{ inputs.issue_title }}
      ISSUE_BODY: ${{ inputs.issue_body }}
      REPOSITORY: ${{ github.repository }}
      FORCE_CLOUDFLARE: ${{ startsWith(inputs.request || '', '@gemini-cli /scout-cloudflare') }}

    steps:
      - name: Validate Gemini activation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${ISSUE_NUMBER}"
          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "::error title=Missing GEMINI_API_KEY::Add the Google AI Studio key as repository Actions secret GEMINI_API_KEY."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run read-only Gemini scout
        id: gemini
        if: ${{ env.FORCE_CLOUDFLARE != 'true' }}
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          gemini_cli_version: ${{ vars.GEMINI_CLI_VERSION || 'latest' }}
          gemini_debug: 'false'
          upload_artifacts: 'false'
          workflow_name: 'gemini-scout'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 12
              },
              "telemetry": {
                "enabled": false
              },
              "tools": {
                "core": [
                  "read_file",
                  "read_many_files",
                  "glob",
                  "grep_search",
                  "list_directory"
                ]
              }
            }
          prompt: |-
            You are the read-only scouting agent for the Kepenk.ai Randevu repository.

            Your job is to reduce implementation cost before a coding agent is invoked.
            Do not edit files. Do not run shell commands. Do not create branches, commits, pull requests, reviews, labels, or other GitHub mutations.

            Repository: ${{ github.repository }}
            Issue or PR number: #${{ inputs.issue_number }}

            Issue title:
            ${{ inputs.issue_title }}

            Issue body:
            ${{ inputs.issue_body }}

            Trusted maintainer request:
            ${{ inputs.request }}

            Inspect only the repository context needed to answer. Prefer targeted searches over reading the whole repository.

            Return a compact implementation packet with exactly these sections:

            ## Gemini Scout
            **Goal:** one-sentence task interpretation.

            **Likely files:** at most 10 repository paths, with one short reason each.

            **Dependencies / contracts:** relevant existing APIs, schemas, tests, decisions, or neighboring work.

            **Risks / unknowns:** only concrete blockers or ambiguity. Write "None" when there are none.

            **Suggested validation:** the smallest useful validation set.

            **Qwen handoff:** a concise implementation instruction that a maintainer can paste after `@qwencoder /implement`.

            Do not implement the task and do not provide a final review verdict.

      - name: Select scout provider
        id: route
        env:
          GEMINI_OUTCOME: ${{ steps.gemini.outcome }}
          GEMINI_ERROR: ${{ steps.gemini.outputs.error }}
        run: |
          set -euo pipefail

          if [ "${FORCE_CLOUDFLARE}" = "true" ]; then
            echo "provider=cloudflare" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${GEMINI_OUTCOME}" = "success" ]; then
            echo "provider=gemini" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          normalized="$(printf '%s' "${GEMINI_ERROR}" | tr '[:upper:]' '[:lower:]')"
          if printf '%s' "${normalized}" | grep -Eq 'resource_exhausted|quota|rate.?limit|429|credit|capacity'; then
            echo "Gemini quota/capacity unavailable; routing the same scout role to Cloudflare Workers AI."
            echo "provider=cloudflare" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "::error title=Gemini scout failed::Gemini failed for a non-quota reason; Cloudflare fallback was not used."
          exit 1

      - name: Prepare Cloudflare Workers AI fallback
        id: cloudflare
        if: ${{ steps.route.outputs.provider == 'cloudflare' }}
        env:
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_AI_API_TOKEN}" ]; then
            echo "::error title=Missing CLOUDFLARE_AI_API_TOKEN::Add a Workers AI token before using Cloudflare fallback."
            exit 1
          fi

          umask 077
          npx --yes wrangler@4.131.0 whoami --json > "${RUNNER_TEMP}/cloudflare-whoami.json"

          node <<'NODE'
          const { appendFileSync, readFileSync } = require('node:fs');

          const payload = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/cloudflare-whoami.json', 'utf8'));
          if (payload.loggedIn !== true) throw new Error('Cloudflare token authentication failed');

          const configuredAccountId = String(process.env.CLOUDFLARE_ACCOUNT_ID ?? '').trim();
          const accounts = Array.isArray(payload.accounts) ? payload.accounts : [];
          const accountId = configuredAccountId || (accounts.length === 1
            ? String(accounts[0]?.id ?? accounts[0]?.accountId ?? '').trim()
            : '');
          if (!/^[a-f0-9]{32}$/i.test(accountId)) throw new Error('Cloudflare account ID is unavailable or invalid');

          const token = process.env.CLOUDFLARE_AI_API_TOKEN;
          const model = '@cf/zai-org/glm-4.7-flash';
          const modelsUrl = new URL(`https://api.cloudflare.com/client/v4/accounts/${accountId}/ai/models/search`);
          modelsUrl.searchParams.set('search', model);
          modelsUrl.searchParams.set('per_page', '5');

          fetch(modelsUrl, { headers: { Authorization: `Bearer ${token}` } })
            .then(async (response) => {
              const body = await response.json().catch(() => null);
              if (!response.ok || body?.success !== true) {
                throw new Error(`Cloudflare Workers AI permission check failed (HTTP ${response.status})`);
              }
              appendFileSync(process.env.GITHUB_OUTPUT,
                `base_url=https://api.cloudflare.com/client/v4/accounts/${accountId}/ai/v1\nmodel=${model}\n`,
                'utf8');
              console.log(`Cloudflare Workers AI fallback ready on account ${accountId.slice(0, 6)}…`);
            })
            .catch((error) => {
              console.error(error instanceof Error ? error.message : String(error));
              process.exit(1);
            });
          NODE

      - name: Run Cloudflare scout fallback
        id: cloudflare_scout
        if: ${{ steps.route.outputs.provider == 'cloudflare' }}
        uses: QwenLM/qwen-code-action@v1
        with:
          openai_api_key: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
          openai_base_url: ${{ steps.cloudflare.outputs.base_url }}
          openai_model: ${{ steps.cloudflare.outputs.model }}
          qwen_debug: 'false'
          upload_artifacts: 'false'
          workflow_name: 'cloudflare-scout-fallback'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 12
              },
              "telemetry": {
                "enabled": false
              },
              "tools": {
                "core": [
                  "read_file",
                  "grep_search",
                  "glob"
                ]
              }
            }
          prompt: |-
            You are the read-only scouting agent for the Kepenk.ai Randevu repository.
            Cloudflare Workers AI is serving this request only because Gemini Scout quota/capacity is unavailable or Cloudflare was explicitly selected for testing.

            Do not edit files. Do not run shell commands. Do not create branches, commits, pull requests, reviews, labels, or other repository mutations.

            Repository: ${{ github.repository }}
            Issue or PR number: #${{ inputs.issue_number }}

            Issue title:
            ${{ inputs.issue_title }}

            Issue body:
            ${{ inputs.issue_body }}

            Trusted maintainer request:
            ${{ inputs.request }}

            Inspect only the repository context needed to answer. Prefer targeted searches over broad reads.

            Return a compact implementation packet with exactly these sections:

            ## Cloudflare Scout
            **Goal:** one-sentence task interpretation.

            **Likely files:** at most 10 repository paths, with one short reason each.

            **Dependencies / contracts:** relevant existing APIs, schemas, tests, decisions, or neighboring work.

            **Risks / unknowns:** only concrete blockers or ambiguity. Write "None" when there are none.

            **Suggested validation:** the smallest useful validation set.

            **Implementer handoff:** a concise implementation instruction for the assigned implementer.

            Do not implement the task and do not provide a final review verdict.

      - name: Post scout result
        env:
          GH_TOKEN: ${{ github.token }}
          SCOUT_PROVIDER: ${{ steps.route.outputs.provider }}
          GEMINI_SUMMARY: ${{ steps.gemini.outputs.summary }}
          CLOUDFLARE_SUMMARY: ${{ steps.cloudflare_scout.outputs.summary }}
        run: |
          set -euo pipefail

          if [ "${SCOUT_PROVIDER}" = "cloudflare" ]; then
            heading="## Cloudflare Scout (Gemini fallback)"
            summary="${CLOUDFLARE_SUMMARY}"
          else
            heading="## Gemini Scout"
            summary="${GEMINI_SUMMARY}"
          fi

          body_file="${RUNNER_TEMP}/ai-scout.md"
          {
            printf '%s\n\n' "${heading}"
            printf '%s' "${summary}" | head -c 12000
            printf '\n'
          } > "${body_file}"

          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body-file "${body_file}"
