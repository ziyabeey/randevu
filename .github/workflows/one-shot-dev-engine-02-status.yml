# trigger one-shot DEV-ENGINE-02 status sync
name: One-shot DEV-ENGINE-02 status sync

on:
  push:
    branches:
      - chore/dev-engine-02-closeout

permissions:
  contents: write

jobs:
  sync:
    name: Record live DEV-ENGINE-02 evidence
    if: ${{ contains(github.event.head_commit.message, 'trigger one-shot DEV-ENGINE-02 status sync') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/dev-engine-02-closeout
          fetch-depth: 1
          persist-credentials: true

      - name: Update only TASKS and remove one-shot workflow
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          tasks = Path('TASKS.md')
          text = tasks.read_text()
          old = "| DEV-ENGINE-02 | Deterministik dispatcher, Haiku context compression ve Opus escalation delivery | DEV-ENGINE-01 | İncelemede | Koordinatör / 2026-09-19 | M / FOCUSED · [PR #182](https://github.com/ziyabeey1-ai/randevu/pull/182) current repair candidate · [PR #179](https://github.com/ziyabeey1-ai/randevu/pull/179) bu PR tarafından superseded · pure reducer + GitHub OIDC-attested Haiku → Opus handoff · exact-head CI ve review-thread kapanışı bekleniyor |"
          new = "| DEV-ENGINE-02 | Deterministik dispatcher, Haiku context compression ve Opus escalation delivery | DEV-ENGINE-01 | Main'de / kabul açık | Koordinatör / 2026-09-19 | M / FOCUSED · [PR #182](https://github.com/ziyabeey1-ai/randevu/pull/182) final head `52fc9252` · exact-head [CI #1528](https://github.com/ziyabeey1-ai/randevu/actions/runs/35439225186) success · 8 material review thread kapalı · main `74b1c1d6` · post-main [CI #1529](https://github.com/ziyabeey1-ai/randevu/actions/runs/35439377092) success · [PR #179](https://github.com/ziyabeey1-ai/randevu/pull/179) closed/superseded · canlı synthetic E2E [run #1](https://github.com/ziyabeey1-ai/randevu/actions/runs/35439562691) success: Dispatcher `REASONING_REQUIRED` → GitHub OIDC → Haiku Routine HTTP 200, case `feb9a83c`, source `3883` bytes, [Haiku session](https://claude.ai/code/cse_013YRrN6CKgigoS8UA8iHKZg) · Opus handoff/compression receipt bu Claude oturumunda açık |"
          if old not in text:
              raise SystemExit('DEV-ENGINE-02 canonical row did not match expected main state')
          tasks.write_text(text.replace(old, new, 1))
          Path('.github/workflows/one-shot-dev-engine-02-status.yml').unlink()
          PY

          git diff --check
          git config user.name 'Kepenk Coordinator'
          git config user.email 'actions@users.noreply.github.com'
          git add TASKS.md .github/workflows/one-shot-dev-engine-02-status.yml
          git commit -m 'chore: record live DEV-ENGINE-02 evidence'
          git push origin HEAD:chore/dev-engine-02-closeout
