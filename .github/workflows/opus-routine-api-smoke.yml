name: Opus Routine API Smoke

on:
  push:
    branches:
      - experiment/escalation-context-delivery

permissions:
  contents: read

jobs:
  smoke:
    name: Opus Routine fire smoke
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fire minimal Opus Routine smoke
        env:
          CLAUDE_ROUTINE_URL: https://api.anthropic.com/v1/claude_code/routines/trig_01EzXBHit6gQmW7S9XfU2ChC/fire
          CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_HAIKU_ROUTINE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLAUDE_ROUTINE_TOKEN}"
          printf '%s\n' '{"text":"API_SMOKE_TEST_ONLY. Do not modify any repository state. Confirm receipt and return NO_ACTION."}' > "${RUNNER_TEMP}/opus-smoke.json"
          node scripts/fire-claude-routine.mjs --body "${RUNNER_TEMP}/opus-smoke.json"
